<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .quiz-container { max-width: 600px; }
        .question { margin-bottom: 20px; }
        .options label { display: block; margin: 6px 0; }
    </style>
</head>
<body>
    <div class="quiz-container">
        <h1>General Knowledge Quiz</h1>

        <div class="question">
            <p><strong>1. What is the young one of a frog called?</strong></p>
            <label><input type="radio" name="q1"> Tadpole</label>
            <label><input type="radio" name="q1"> Larva</label>
            <label><input type="radio" name="q1"> Pupa</label>
            <label><input type="radio" name="q1"> Caterpillar</label>
            <label><input type="radio" name="q1"> Nymph</label>
        </div>

        <div class="question">
            <p><strong>2. Which planet is known as the Red Planet?</strong></p>
            <label><input type="radio" name="q2"> Earth</label>
            <label><input type="radio" name="q2"> Mars</label>
            <label><input type="radio" name="q2"> Venus</label>
            <label><input type="radio" name="q2"> Jupiter</label>
        </div>

        <div class="question">
            <p><strong>3. What gas do plants release during photosynthesis?</strong></p>
            <label><input type="radio" name="q3"> Carbon dioxide</label>
            <label><input type="radio" name="q3"> Oxygen</label>
            <label><input type="radio" name="q3"> Nitrogen</label>
            <label><input type="radio" name="q3"> Hydrogen</label>
        </div>
    </div>
</body>
</html>
